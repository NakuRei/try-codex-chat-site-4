<header class="page-title"><h1>夜の展望台</h1></header>
<p class="center">眠れない夜は、ここから星を見ています。</p>
<p class="center small">遠くの光が、ときどき合図を送ってきます。<br>同じ順番で返してみると、何かあるかもしれません。</p>
<div class="constellation" role="group" aria-label="4つの星">
<button type="button" class="sky-star star-1" data-star="0" aria-label="1番の星" disabled>✦<span>1</span></button>
<button type="button" class="sky-star star-2" data-star="1" aria-label="2番の星" disabled>✦<span>2</span></button>
<button type="button" class="sky-star star-3" data-star="2" aria-label="3番の星" disabled>✦<span>3</span></button>
<button type="button" class="sky-star star-4" data-star="3" aria-label="4番の星" disabled>✦<span>4</span></button>
</div>
<p class="center"><button id="play-stars" type="button" data-needs-js disabled>星の合図を見る</button></p>
<p id="star-result" class="center" role="status">しばらく、空を眺めていよう。</p>
<p class="center small"><label><input type="checkbox" id="still-stars"> 光る演出を使わず、番号で見る</label></p>
<p data-found="stars" class="found-note" hidden>遠くの光が、こちらに合図を返してくれました。<br>「さいごの文字は <strong>み</strong>。今夜は、よく眠れますように。」</p>
<hr>
<p class="center small">空を見るのに、用事はいりません。<br>何回まちがえても、星は逃げません。</p>
